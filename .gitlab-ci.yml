stages:
  - check
  - build
  - deploy

variables:
  MIX_ENV: test
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: postgres
  ELIXIR_VERSION: "1.19.2"
  OTP_VERSION: "28.1.1"
  DEBIAN_VERSION: "trixie-20251020-slim"

checks:
  stage: check
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-debian-${DEBIAN_VERSION}
  services:
    - name: postgres:17
      alias: postgres
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
  script:
    - mix compile --warnings-as-errors
    - mix format --check-formatted
    - mix credo --strict
    - mix sobelow --config
    - mix deps.unlock --check-unused
    - mix deps.audit
    - mix hex.audit
    - mix test
  cache:
    - key:
        files:
          - mix.lock
      paths:
        - deps
    - key: build-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - build-$CI_DEFAULT_BRANCH
      paths:
        - _build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-and-push-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create my-builder
    - docker buildx create my-builder --driver docker-container --use
  script:
    - OLD_DIGEST=$(docker manifest inspect $CI_REGISTRY_IMAGE:latest 2>/dev/null | grep -m1 '"digest"' | cut -d'"' -f4 || echo "none")
    - echo "Old digest - $OLD_DIGEST"
    - >
      docker buildx build --push
      -t $CI_REGISTRY_IMAGE:latest
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/cache-image,mode=max
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/cache-image .
    - NEW_DIGEST=$(docker manifest inspect $CI_REGISTRY_IMAGE:latest | grep -m1 '"digest"' | cut -d'"' -f4)
    - echo "New digest - $NEW_DIGEST"
    - |
      if [ "$OLD_DIGEST" = "$NEW_DIGEST" ]; then
        echo "IMAGE_CHANGED=false" >> build.env
        echo "Image unchanged, skipping deploy"
      else
        echo "IMAGE_CHANGED=true" >> build.env
        echo "Image changed, will trigger deploy"
      fi
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - checks

deploy-webhook:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache curl
  script:
    - curl -X POST "$DEPLOY_WEBHOOK_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $IMAGE_CHANGED == "true"
  needs:
    - build-and-push-image
