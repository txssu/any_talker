name: Sync claude branches to GitLab

on:
  push:
    branches:
      - "claude/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 gitlab.com >> ~/.ssh/known_hosts

      - name: Push branch to GitLab
        run: |
          git remote add gitlab git@gitlab.com:txssu/any_talker.git
          git push gitlab "${{ github.ref_name }}"
